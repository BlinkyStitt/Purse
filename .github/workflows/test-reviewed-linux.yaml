name: Reviewed Purse contract tests

on:
  workflow_call:

permissions: {}

jobs:
  functional:
    name: Native contract tests
    if: github.repository == 'BlinkyStitt/Purse'
    # This custom label requires a repository-scoped self-hosted KVM runner.
    runs-on: ski-kvm-public-pr
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ApeWorX/github-action@e375cf9d3697af2e21f6ddc5dfab209789b3054e # reviewed v3
        with:
          python-version: '3.11.14'
          ape-version-pin: '0.8.55'
          ape-plugins-list: 'vyper==0.8.13 foundry==0.8.14'
      - name: Compile and check every contract size
        run: |
          vyper --version
          ape compile --size
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # existing v1
        with:
          version: v1.9.0
      - name: Run the complete contract suite with gas and coverage
        run: ape test -s --gas --coverage
